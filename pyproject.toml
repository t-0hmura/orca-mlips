[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-mlips"
dynamic = ["version"]
description = "MLIP plugins for ORCA ExtTool (UMA, OrbMol, MACE)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "ase",
]

[project.optional-dependencies]
uma = ["torch>=2.8.0", "fairchem-core>=2.13"]
orb = ["torch>=2.8.0", "orb-models"]
mace = ["torch>=2.8.0", "mace-torch"]

[project.urls]
Homepage = "https://github.com/t-0hmura/orca-mlips"
Repository = "https://github.com/t-0hmura/orca-mlips"

[project.scripts]
orca-mlips-uma = "orca_mlips_plugins.uma_orca:main"
orca-mlips-orb = "orca_mlips_plugins.orbmol_orca:main"
orca-mlips-mace = "orca_mlips_plugins.mace_orca:main"
uma = "orca_mlips_plugins.uma_orca:main"
orb = "orca_mlips_plugins.orbmol_orca:main"
mace = "orca_mlips_plugins.mace_orca:main"

[tool.setuptools]
packages = ["orca_mlips_plugins"]
include-package-data = false

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools.package-dir]
orca_mlips_plugins = "plugins"
